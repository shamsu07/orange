name: macOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests and release build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record build environment
        run: |
          sw_vers
          uname -m
          swift --version
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            echo "No FFmpeg on PATH; media integration tests can skip."
          fi

      # Default CI does not download or compile optional third-party backends.
      # Tests explicitly skip media cases when FFmpeg/ffprobe are unavailable.
      - name: Run source tests
        run: bash scripts/test.sh

      - name: Build local release app
        run: bash scripts/build.sh

      - name: Verify bundle and command-line self-check
        run: |
          codesign --verify --deep --strict build/Orange.app
          build/Orange.app/Contents/MacOS/Orange --self-check

      - name: Verify real update signing boundaries
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  release-tooling:
    name: Release tooling and local website links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test feed generation boundaries
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Check local site links
        run: python3 site/check.py
