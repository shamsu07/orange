name: macOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests and release build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record build environment
        run: |
          sw_vers
          uname -m
          swift --version
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            echo "No FFmpeg on PATH; media integration tests can skip."
          fi

      # Default CI does not download or compile optional third-party backends.
      # Tests explicitly skip media cases when FFmpeg/ffprobe are unavailable.
      - name: Run source tests
        run: bash scripts/test.sh

      - name: Build local release app
        run: bash scripts/build.sh

      - name: Verify bundle and command-line self-check
        run: |
          codesign --verify --deep --strict build/Orange.app
          build/Orange.app/Contents/MacOS/Orange --self-check
