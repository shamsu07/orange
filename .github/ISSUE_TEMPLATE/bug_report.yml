name: Bug report
description: Report a reproducible failure in an implemented Orange workflow.
body:
  - type: markdown
    attributes:
      value: |
        For a suspected security vulnerability, follow [SECURITY.md](https://github.com/shamsu07/orange/blob/main/SECURITY.md) instead of posting exploit details here. Use generated or non-private files, and remove personal paths from logs and screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the input type, selected format/tool/action and conversion settings. Link a small generated or non-private fixture if available.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Orange version, macOS version and Mac architecture
      placeholder: Orange release or commit; macOS version; arm64 or x86_64
    validations:
      required: true
  - type: textarea
    id: backend
    attributes:
      label: Backend and diagnostics
      description: For media, include the selected FFmpeg path/version and relevant errors. For memory reports, distinguish RSS from physical footprint. Remove private paths and file contents.
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Output inspection, screenshots or test results that help reproduce the failure. Remove account names, personal paths, document contents and other private information.
