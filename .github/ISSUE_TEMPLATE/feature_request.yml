name: Feature request
description: Propose an improvement to Orange's local file workflow.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Keep private files, personal paths and credentials out of this report. Security vulnerabilities belong in [SECURITY.md](https://github.com/shamsu07/orange/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and where does the current experience fall short?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the visible result and a concrete example, including file types when relevant.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Relevant limits or evidence
      description: Optional. Include non-private examples, accessibility needs, format/fidelity requirements or alternatives you tried.
