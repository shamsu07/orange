name: Reference parity gap
description: Record an observed difference between Orange and the native reference.
body:
  - type: input
    id: reference
    attributes:
      label: Reference version and evidence source
      description: State whether this came from the native application, official documentation or a website demo.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed reference behavior
      description: Give exact steps and the visible result. Link screenshots or non-private fixtures when useful.
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: Orange difference and acceptance criteria
      description: Describe current Orange behavior and a concrete check that would establish the gap is closed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Orange version and macOS environment
